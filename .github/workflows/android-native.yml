name: Android native prototype

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - upstream.json
      - patches/**
      - scripts/build-android.sh
      - scripts/prepare-source.py
      - tests/android-file-lock.rs
      - tests/test_patches.py
      - tests/credentials/**

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-app:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          gradle-version: '9.6.0'
      - name: Install Android application SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0"'
      - name: Check Kotlin, lint and supervisor before the expensive Rust build
        run: |
          mkdir -p target
          cc -std=c11 -Wall -Wextra -Werror android/native/supervisor.c -o target/supervisor-host
          python3 tests/supervisor_test.py target/supervisor-host
          cd android
          gradle --no-daemon --console=plain testReleaseUnitTest lintRelease
  build:
    needs: validate-app
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libclang-dev protobuf-compiler perl
      - name: Install pinned Android NDK
        run: |
          ndk=$(python3 -c 'import json; print(json.load(open("upstream.json"))["ndk"])')
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk"
      - name: Cache Rust dependencies and compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-arm64-${{ runner.os }}-${{ hashFiles('upstream.json', 'patches/**', 'scripts/build-android.sh') }}
          restore-keys: android-arm64-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.0'
      - name: Build Android ARM64 binary
        run: bash scripts/build-android.sh
      - name: Upload reusable native binary before building the application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mina-android-arm64
          path: |
            dist/mina-android-arm64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          gradle-version: '9.6.0'
      - name: Install Android application SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0"'
      - name: Build and test Android application
        env:
          MINA_SIGNING_KEYSTORE_BASE64: ${{ secrets.MINA_SIGNING_KEYSTORE_BASE64 }}
          MINA_SIGNING_STORE_PASSWORD: ${{ secrets.MINA_SIGNING_STORE_PASSWORD }}
          MINA_SIGNING_KEY_PASSWORD: ${{ secrets.MINA_SIGNING_KEY_PASSWORD }}
          MINA_SIGNING_ALIAS: ${{ secrets.MINA_SIGNING_ALIAS }}
        run: bash scripts/build-apk.sh
      - name: Upload signed non-debuggable Android APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mina-android-devnet-apk
          path: |
            dist/mina-android-release.apk
            dist/APK-SHA256SUMS
            dist/APK-BUILD-INFO.txt
            dist/ANDROID-DEPENDENCIES.json
            dist/ANDROID-THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-build-diagnostics
          path: logs/
          if-no-files-found: ignore
