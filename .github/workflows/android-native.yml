name: Android native prototype

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - upstream.json
      - patches/**
      - scripts/build-android.sh
      - scripts/prepare-source.py
      - tests/android-file-lock.rs
      - tests/credentials/**
  pull_request:
    paths:
      - upstream.json
      - patches/**
      - scripts/build-android.sh
      - scripts/prepare-source.py
      - tests/android-file-lock.rs
      - tests/credentials/**

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android application SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Check Kotlin, lint and supervisor before the expensive Rust build
        run: |
          mkdir -p target
          cc -std=c11 -Wall -Wextra -Werror android/native/supervisor.c -o target/supervisor-host
          python3 tests/supervisor_test.py target/supervisor-host
          cd android
          gradle --no-daemon --console=plain testDebugUnitTest lintDebug
  build:
    needs: validate-app
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libclang-dev protobuf-compiler perl
      - name: Install pinned Android NDK
        run: |
          ndk=$(python3 -c 'import json; print(json.load(open("upstream.json"))["ndk"])')
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk"
      - name: Cache Rust dependencies and compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-arm64-${{ runner.os }}-${{ hashFiles('upstream.json', 'patches/**', 'scripts/build-android.sh') }}
          restore-keys: android-arm64-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Build Android ARM64 binary
        run: bash scripts/build-android.sh
      - name: Upload reusable native binary before building the application
        uses: actions/upload-artifact@v4
        with:
          name: mina-android-arm64
          path: |
            dist/mina-android-arm64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android application SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Keep the test APK signing identity across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mina-android-devnet-debug-signing-v1
      - name: Build and test Android application
        env:
          MINA_SIGNING_KEYSTORE_BASE64: ${{ secrets.MINA_SIGNING_KEYSTORE_BASE64 }}
          MINA_SIGNING_STORE_PASSWORD: ${{ secrets.MINA_SIGNING_STORE_PASSWORD }}
          MINA_SIGNING_KEY_PASSWORD: ${{ secrets.MINA_SIGNING_KEY_PASSWORD }}
          MINA_SIGNING_ALIAS: ${{ secrets.MINA_SIGNING_ALIAS }}
        run: bash scripts/build-apk.sh
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: mina-android-devnet-apk
          path: |
            dist/mina-android-devnet-debug.apk
            dist/APK-SHA256SUMS
            dist/APK-BUILD-INFO.txt
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: logs/
          if-no-files-found: ignore
