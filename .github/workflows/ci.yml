name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.0'
      - name: Test tooling and Android patch application without signing
        run: |
          python3 scripts/prepare-source.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/select-native-artifact.test.cjs
          mkdir -p target
          cc -std=c11 -Wall -Wextra -Werror android/native/supervisor.c -o target/supervisor-host
          python3 tests/supervisor_test.py target/supervisor-host
  android-checks:
    name: Android checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Resolve runtime licenses without signing or native compilation
        run: |
          cd android
          gradle --no-daemon --console=plain :app:exportReleaseDependencies
          cd ..
          python3 scripts/android-licenses.py android/app/build/reports/licenses/release-dependencies.json
      - name: Test and lint unsigned release variant
        working-directory: android
        run: gradle --no-daemon --console=plain testReleaseUnitTest lintRelease
      - name: Upload dependency inventory and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-checks
          path: |
            dist/ANDROID-DEPENDENCIES.json
            dist/ANDROID-THIRD-PARTY-NOTICES.txt
            android/app/build/reports/
          if-no-files-found: ignore
